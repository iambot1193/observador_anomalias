name: ci

on:
  push:
  pull_request:

jobs:
  build-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Smoke test: o gerador tem que produzir o dashboard de exemplo sem erro.
      - run: python gerar_exemplo.py
      - run: test -s exemplo/index.html
