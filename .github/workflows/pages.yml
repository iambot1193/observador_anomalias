name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Regenera o exemplo (dados fictícios) e publica só essa pasta.
      - run: python gerar_exemplo.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: exemplo
      - id: deployment
        uses: actions/deploy-pages@v4
